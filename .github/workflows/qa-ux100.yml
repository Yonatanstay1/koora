name: qa-ux100
on: workflow_dispatch
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium webkit
      - run: node scripts/qa-ux100.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ux100, path: shots/ux100 }
