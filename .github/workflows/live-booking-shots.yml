name: live-booking-shots
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: node --test test/beds24.test.cjs
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          node scripts/preview-live.cjs &
          sleep 2
          node scripts/shot-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots, path: shots }
